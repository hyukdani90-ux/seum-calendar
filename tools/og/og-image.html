<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #F3EFE7; font-family: 'Noto Sans KR', sans-serif; color: #423735; }
  .sheet { position: absolute; inset: 40px 48px 52px 40px; background: #FAF6EE; border: 4px solid #4A3E3D; border-radius: 6px; box-shadow: 14px 12px 0 #F8E7C4, 14px 12px 0 4px #4A3E3D; }
  .margin { position: absolute; left: 62px; top: 0; bottom: 0; border-left: 3px solid #4A3E3D; }
  .hole { position: absolute; left: 20px; width: 22px; height: 22px; border: 3px solid #4A3E3D; border-radius: 50%; }
  .text { position: absolute; left: 112px; top: 46px; }
  .sub { font-size: 40px; font-weight: 700; }
  .title { font-size: 92px; font-weight: 900; letter-spacing: -3px; line-height: 1.15; margin-top: 6px; }
  .chips { display: flex; gap: 12px; margin-top: 22px; }
  .chip { font-size: 28px; font-weight: 700; padding: 8px 20px; border: 3px solid #4A3E3D; border-radius: 999px; background: #fff; }
  .foot { position: absolute; left: 65px; right: 0; bottom: 0; height: 84px; border-top: 3px solid #4A3E3D; background: #F8F3E7; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; gap: 40px; }
  .books { position: absolute; right: 60px; bottom: 87px; width: 300px; overflow: visible; }
</style></head>
<body>
  <div class="sheet">
    <div class="margin"></div>
    <div class="hole" style="top:26px"></div><div class="hole" style="bottom:26px"></div>
    <div class="text">
      <div class="sub">천안세움교회 4대 신앙생활 실천표</div>
      <div class="title">말씀 및 묵상<br>달력</div>
      <div class="chips"><span class="chip">📖 말씀</span><span class="chip">🙏 기도</span><span class="chip">📜 통독</span><span class="chip">⛪ 예배</span></div>
    </div>
    <svg class="books" viewBox="-30 0 330 300">
      <g stroke="#4A3E3D" stroke-width="5" stroke-linejoin="round">
        <g transform="translate(18 134) rotate(12)"><rect width="38" height="160" rx="3" fill="#FBCBD2"/></g>
        <rect x="52" y="120" width="46" height="180" rx="3" fill="#FFF4D0"/>
        <rect x="63" y="136" width="24" height="148" rx="12" fill="#FFBA59" stroke="#E29F3D" stroke-width="3"/>
        <rect x="98" y="40" width="48" height="260" rx="3" fill="#FDC6AE"/>
        <rect x="98" y="56" width="48" height="9" fill="#9CE4CE" stroke-width="4"/>
        <rect x="146" y="70" width="46" height="230" rx="3" fill="#FDC6AE"/>
        <rect x="146" y="86" width="46" height="9" fill="#9CE4CE" stroke-width="4"/>
        <rect x="192" y="104" width="22" height="196" rx="2" fill="#D2B7E5"/>
        <rect x="214" y="150" width="32" height="150" rx="3" fill="#A8E8FD"/>
        <rect x="246" y="120" width="46" height="180" rx="3" fill="#FFF4D0"/>
        <rect x="257" y="136" width="24" height="148" rx="12" fill="#FFBA59" stroke="#E29F3D" stroke-width="3"/>
      </g>
    </svg>
    <div class="foot"><span>휴대폰에서 바로 체크하세요</span><span>·</span><span>하나님과 동행하는 삶</span></div>
  </div>
</body></html>
